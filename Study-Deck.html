<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Study Deck</title>
    <!-- Link your CSS file here -->
    <link rel="stylesheet" href="Study-Deck.css">
</head>
<body>
    
    <!-- We wrap everything in a main container to easily center it later -->
    <div id="app-container">
        
        <!-- 1. THE HEADER -->
        <h1>🧠 The CS Study Deck</h1>

        <!-- 2. THE INPUT AREA (For adding new cards) -->
        <div class="input-section">
            <input type="text" id="question-input" placeholder="Question">
            <input type="text" id="answer-input" placeholder="Answer">
            <button id="save-btn">Save Card</button>
        </div>

        <!-- 3. THE FLASHCARD DISPLAY -->
        <div class="flashcard-section">
            <!-- This shows the student where they are in the deck -->
            <p id="card-counter">Card 0 of 0</p>
            
            <!-- The actual clickable card -->
            <div id="flashcard">
                <h2 id="card-text">Add a card to start studying!</h2>
                <p id="flip-hint">(Click card to flip)</p>
            </div>
        </div>

        <!-- 4. THE CONTROLS (Navigation and Deleting) -->
        <div class="controls-section">
            <button id="prev-btn">< Previous</button>
            <button id="delete-btn">🗑️ Delete Card</button>
            <button id="next-btn">Next ></button>
        </div>

    </div>

    <!-- Link your JavaScript file at the very bottom of the body -->
    <script src="Study-Deck.js"></script>
</body>
</html>
